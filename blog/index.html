<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Common Hours, an independent journal by Ellis Vale.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-vvxeX1PYBjVoiDhH/SZMBkLx5x6aNHg8JmxwY5ojcc4='; worker-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; media-src https:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<script>const q=new URLSearchParams(location.search);if(q.get("post"))document.documentElement.classList.add("article-page");if(!["view","post","month","tag","series","page"].some(k=>q.has(k)))document.documentElement.classList.add("home-page");</script>
<title>The Common Hours — An independent journal</title>
<!-- public-api-connection -->
<link rel="alternate" type="application/rss+xml" title="The Common Hours" href="feed.xml">
<link rel="preload" as="font" type="font/woff2" href="serif.woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="journal.js">
<link rel="modulepreload" href="photos.js">
<link rel="modulepreload" href="common.js">
<link rel="modulepreload" href="public-cache.js">
<link rel="modulepreload" href="config.js">
</head>
<body id="top">
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap mast">
    <a class="brand" href="./">The Common Hours</a>
    <nav aria-label="Main navigation">
      <a href="./" id="journal-link">Journal</a><a href="?view=archive" id="archive-link">Archive</a><a href="?view=photos" id="photos-link">Photos</a>
      <a href="?view=start" id="start-link">Start here</a><a href="?view=search" id="search-link">Search</a><a href="?view=saved" id="saved-link">Read later</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <figure class="week-photo" id="week-photo" aria-label="Photo of the Week" aria-busy="true">
    <div class="slide">
      <a id="featured-photo-link" aria-label="Open the featured photo">
        <img width="1200" height="800" alt="" draggable="false" decoding="async" fetchpriority="high">
        <span class="slide-label">Photo of the Week</span>
      </a>
      <div id="slide-controls" hidden>
        <button id="slide-prev" type="button" aria-label="Previous photo">‹</button>
        <button id="slide-next" type="button" aria-label="Next photo">›</button>
      </div>
    </div>
    <figcaption>
      <span id="photo-caption"></span>
      <span class="slide-actions">
        <span id="slide-count"></span>
        <button id="slide-toggle" type="button" hidden>Pause slideshow</button>
        <a href="?view=photos">Photo archive ↗</a>
      </span>
    </figcaption>
  </figure>
  <!-- featured-snapshot -->
  <div class="layout">
    <section id="content" tabindex="-1" aria-label="Journal content" aria-busy="true">
      <p class="loading sr-only" role="status">Loading journal…</p>
      <div class="content-skeleton" aria-hidden="true">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
      </div>
    </section>
    <aside id="sidebar" aria-label="Blog archive"></aside>
  </div>
  <noscript><p>Enable JavaScript to browse entries and leave comments.</p></noscript>
</main>
<footer class="site-footer">
  <img class="footer-landscape" src="footer-landscape.jpg" width="1440" height="182" alt="" decoding="async">
  <div class="wrap"><nav aria-label="Site policies and feed"><a href="?view=privacy">Privacy</a><a href="?view=terms">Terms</a><a href="feed.xml">RSS</a></nav><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
</footer>
<script src="route.js"></script>
<script type="module" src="start.js"></script>
</body>
</html>
