<script>const l=new URLSearchParams(location.search),w=l.get("view");if(["archive","topics","photos","start","series","privacy","terms","collections","photo-essays"].includes(w)){const t=new URL(w+".html",location.href);l.delete("view");l.delete("post");t.search=l.toString();t.hash=location.hash;location.replace(t.href)}const q=new URLSearchParams(document.documentElement.dataset.route),f=location.pathname.split("/").pop().replace(/\.html$/,"");if(!q.size&&f&&f!=="index"){if(f.startsWith("entry-"))q.set("post",f.slice(6));else if(f.startsWith("photo-")&&f!=="photo-essays"){q.set("view","photo");q.set("photo",f.slice(6))}else q.set("view",f)}for(const[k,v]of new URLSearchParams(location.search))q.set(k,v);const v=q.get("view"),p=q.get("post"),h=document.documentElement;h.classList.remove("article-page","home-page","wide-page","policy-page");if(p)h.classList.add("article-page");if(v==="search"||v==="saved"||!["view","post","month","tag","series","page"].some(k=>q.has(k)))h.classList.add("home-page");h.dataset.journalPage=({photos:"photos",photo:"photo",archive:"archive",topics:"archive",series:"archive",review:"article",privacy:"article",terms:"article"})[v]|| (p?"article":"journal");if(["photos","photo","review","start","series","topics"].includes(v)||q.get("series"))h.classList.add("wide-page");if(v==="privacy"||v==="terms")h.classList.add("policy-page");</script>

<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header" id="top" tabindex="-1">
  <div class="wrap mast">
    <a class="brand" href="./">The Common Hours</a>
    <nav aria-label="Main navigation">
      <a href="./" id="journal-link">Journal</a><a href="archive.html" id="archive-link">Archive</a><a href="./#featured-photo">Featured Photo</a>
      <a href="start.html" id="start-link">Start here</a>
      <button id="search-link" class="search-icon js-only" type="button" aria-label="Search the journal" aria-expanded="false" aria-controls="nav-search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    </nav>
    <div id="nav-search" class="nav-search" hidden>
      <form id="entry-search" role="search">
        <div class="search-field">
          <label class="sr-only" for="entry-query">Search entries</label>
          <input id="entry-query" name="q" type="text" inputmode="search" enterkeyhint="search" maxlength="100" placeholder="Search the journal" autocomplete="off" aria-controls="search-results">
          <button id="clear-search" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          <button id="submit-search" type="submit">Search</button>
        </div>
      </form>
      <div id="search-results" aria-live="polite"><p>Search titles, article text, or topics.</p></div>
    </div>
  </div>
</header>
<main class="wrap">
  <div id="featured-photo">
  <figure class="featured-photo" id="week-photo" aria-label="Featured Photo" aria-busy="true" hidden>
    <div class="slide" role="group" aria-label="Photo carousel">
      <img width="1200" height="800" alt="" draggable="false" decoding="async" fetchpriority="high">
      <span class="slide-label" aria-hidden="true">Featured Photo</span>
      <button id="slide-next" class="slide-arrow" type="button" aria-label="Next photo" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <figcaption>
      <span id="photo-caption"></span>
      <span id="slide-count"></span>
    </figcaption>
  </figure>
  </div>
  <!-- featured-snapshot -->
  <p id="script-notice">JavaScript is unavailable. You can still read and browse.</p>
  <div class="layout">
    <section id="content" tabindex="-1" aria-label="Journal content" aria-busy="true">
      <!-- public-content -->
      <p class="loading sr-only" role="status">Loading journal…</p>
      <div class="route-skeleton content-skeleton" data-skeleton="article" aria-hidden="true">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
      </div>
      <div class="route-skeleton list-skeleton" data-skeleton="journal" aria-hidden="true">
        <div class="section-head"><div class="skeleton skeleton-heading"></div><span class="skeleton skeleton-count"></span></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line short"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line short"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
      </div>
      <div class="route-skeleton list-skeleton" data-skeleton="archive" aria-hidden="true">
        <div class="section-head"><div class="skeleton skeleton-heading"></div></div>
        <div class="archive-skeleton-rows"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div>
      </div>
      <div class="route-skeleton" data-skeleton="photo" aria-hidden="true">
        <div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div>
        <div class="photo-detail-image skeleton"></div><div class="skeleton skeleton-line short"></div>
      </div>
      <!-- /public-content -->
    </section>
    <aside id="sidebar" aria-label="Blog archive"></aside>
  </div>
</main>
