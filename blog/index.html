<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Common Hours, an independent journal by Ellis Vale.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">

</head>
<body id="top">
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap mast">
    <a class="brand" href="./">The Common Hours</a>
    <nav aria-label="Main navigation">
      <a href="./" id="journal-link">Journal</a><a href="?view=archive" id="archive-link">Archive</a>

  </div>
</header>
<main class="wrap">
  <figure class="month-photo" id="month-photo" hidden>
    <img width="1200" height="800" alt="" draggable="false" decoding="async" fetchpriority="high">

  <div class="layout">
    <section id="content" tabindex="-1" aria-label="Journal content" aria-busy="true"><p class="loading" role="status">Loading journal…</p></section>

  </div>

</main>
<footer class="site-footer">
  <div class="wrap"><nav aria-label="Site policies"><a href="?view=privacy">Privacy</a><a href="?view=terms">Terms</a></nav><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
