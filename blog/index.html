<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Common Hours, an independent journal by Ellis Vale.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-ybe5ML5JfF8LHGSLmMpk8MvD9outKlvPugEeSKFv1Jg='; worker-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; media-src https:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<script>const q=new URLSearchParams(location.search),v=q.get("view"),p=q.get("post"),h=document.documentElement;if(p)h.classList.add("article-page");if(!["view","post","month","tag","series","page"].some(k=>q.has(k)))h.classList.add("home-page");h.dataset.journalPage=({photos:"photos",photo:"photo",search:"search",archive:"archive",review:"article",privacy:"article",terms:"article"})[v]|| (p?"article":"journal");if(["photos","photo","search","review","saved","start"].includes(v)||q.get("series"))h.classList.add("wide-page");if(v==="privacy"||v==="terms")h.classList.add("policy-page");</script>
<title>The Common Hours — An independent journal</title>
<!-- public-api-connection -->
<link rel="alternate" type="application/rss+xml" title="The Common Hours" href="feed.xml">
<link rel="preload" as="font" type="font/woff2" href="serif.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="sans.woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="journal.js">
<link rel="modulepreload" href="photos.js">
<link rel="modulepreload" href="common.js">
<link rel="modulepreload" href="public-cache.js">
<link rel="modulepreload" href="config.js">
</head>
<body id="top">
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap mast">
    <a class="brand" href="./">The Common Hours</a>
    <nav aria-label="Main navigation">
      <a href="./" id="journal-link">Journal</a><a href="?view=archive" id="archive-link">Archive</a><a href="?view=photos" id="photos-link">Photos</a>
      <a href="?view=start" id="start-link">Start here</a><a href="?view=search" id="search-link">Search</a><a href="?view=saved" id="saved-link">Read later</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <figure class="week-photo" id="week-photo" aria-label="Photo of the Week" aria-busy="true">
    <div class="slide">
      <a id="featured-photo-link" aria-label="Open the featured photo">
        <img width="1200" height="800" alt="" draggable="false" decoding="async" fetchpriority="high">
        <span class="slide-label">Photo of the Week</span>
      </a>
      <div id="slide-controls" hidden>
        <button id="slide-prev" type="button" aria-label="Previous photo">‹</button>
        <button id="slide-next" type="button" aria-label="Next photo">›</button>
      </div>
    </div>
    <figcaption>
      <span id="photo-caption"></span>
      <span class="slide-actions">
        <span id="slide-count"></span>
        <button id="slide-toggle" type="button" hidden>Pause slideshow</button>
        <a href="?view=photos">Photo archive ↗</a>
      </span>
    </figcaption>
  </figure>
  <!-- featured-snapshot -->
  <div class="layout">
    <section id="content" tabindex="-1" aria-label="Journal content" aria-busy="true">
      <p class="loading sr-only" role="status">Loading journal…</p>
      <div class="route-skeleton content-skeleton" data-skeleton="article" aria-hidden="true">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div>
      </div>
      <div class="route-skeleton list-skeleton" data-skeleton="journal" aria-hidden="true">
        <div class="section-head"><div class="skeleton skeleton-heading"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line short"></div></div>
        <div class="entry"><div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
      </div>
      <div class="route-skeleton list-skeleton" data-skeleton="archive" aria-hidden="true">
        <div class="section-head"><div class="skeleton skeleton-heading"></div></div>
        <div class="archive-skeleton-rows"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div>
      </div>
      <div class="route-skeleton list-skeleton" data-skeleton="search" aria-hidden="true">
        <div class="section-head"><h1>Search</h1></div>
        <div class="search-skeleton-field skeleton"></div>
        <div class="entry"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div></div>
        <div class="entry"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line short"></div></div>
      </div>
      <section class="route-skeleton photo-archive" data-skeleton="photos">
        <header class="photo-archive-head"><p class="photo-kicker">The Common Hours · Photography</p><h1>Photo archive</h1><p>Browse the photographs featured in the journal by date or series.</p></header>
        <div class="photo-filter-bar">
          <div class="photo-filters" role="group" aria-label="Filter photos">
            <label>Year <select id="photo-year" disabled><option>All years</option></select></label>
            <label>Month <select id="photo-month" disabled><option>All months</option></select></label>
            <label>Series <select id="photo-series" disabled><option>All series</option></select></label>
          </div>
          <div class="photo-filter-meta"><span id="photo-count" aria-live="polite">Loading photos…</span><button id="photo-clear" class="quiet-button" type="button" disabled>Reset</button></div>
        </div>
        <div id="photo-results">
          <div class="photo-grid" aria-hidden="true">
            <div><div class="photo-thumb skeleton"></div><div class="photo-card-caption"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line meta-line"></div></div></div>
            <div><div class="photo-thumb skeleton"></div><div class="photo-card-caption"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line meta-line"></div></div></div>
            <div><div class="photo-thumb skeleton"></div><div class="photo-card-caption"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line meta-line"></div></div></div>
          </div>
        </div>
      </section>
      <div class="route-skeleton" data-skeleton="photo" aria-hidden="true">
        <div class="skeleton skeleton-line meta-line"></div><div class="skeleton skeleton-heading"></div>
        <div class="photo-detail-image skeleton"></div><div class="skeleton skeleton-line short"></div>
      </div>
    </section>
    <aside id="sidebar" aria-label="Blog archive"></aside>
  </div>
  <noscript><p>Enable JavaScript to browse entries and leave comments.</p></noscript>
</main>
<footer class="site-footer">
  <img class="footer-landscape" src="footer-landscape.jpg" width="1440" height="182" alt="" decoding="async">
  <div class="wrap"><nav aria-label="Site policies and feed"><a href="?view=privacy">Privacy</a><a href="?view=terms">Terms</a><a href="feed.xml">RSS</a></nav><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
</footer>
<script src="route.js"></script>
<script type="module" src="start.js"></script>
</body>
</html>
